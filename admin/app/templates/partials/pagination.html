{% macro render(result, endpoint, extra_args={}) %}
{% if result.total_pages > 1 %}
<nav aria-label="Pagination" class="mt-3">
  <ul class="pagination">
    <li class="page-item {{ 'disabled' if result.page <= 1 else '' }}">
      <a class="page-link" href="{{ url_for(endpoint, page=result.page - 1, **extra_args) }}">Previous</a>
    </li>
    <li class="page-item disabled"><span class="page-link">Page {{ result.page }} of {{ result.total_pages }}</span></li>
    <li class="page-item {{ 'disabled' if result.page >= result.total_pages else '' }}">
      <a class="page-link" href="{{ url_for(endpoint, page=result.page + 1, **extra_args) }}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
{% endmacro %}
