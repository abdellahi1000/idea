{% extends "base.html" %}
{% block title %}Sign in required{% endblock %}
{% block guest_content %}
<div class="guest-wrapper">
  <div class="card login-card p-4 text-center">
    <h4>Sign in required</h4>
    <p class="text-muted">Please sign in to continue.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Go to sign in</a>
  </div>
</div>
{% endblock %}
